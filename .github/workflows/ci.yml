name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Ordered cheapest-to-most-expensive so an obvious break fails fast.
      #
      # Not yet `--deny-warnings`: there is a known backlog of 9 warnings
      # (set-state-in-effect, only-export-components, refs-during-render,
      # no-eval). The lint-cleanup workstream clears them and then flips this
      # to blocking. Advertising a gate that cannot pass would be worse than
      # saying plainly that it is not a gate yet.
      - name: Lint
        run: npx oxlint

      - name: Typecheck
        run: npx tsc -b

      - name: Unit and integration tests
        run: npx vitest run --reporter=dot

      # The build needs the Vite env vars to exist, but not to be real: the
      # Supabase client is constructed at module load and the AI key never
      # reaches the client at all.
      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

      # Not optional, and not last because it is least important.
      #
      # A hooks-order mistake in the editor page shipped once because the unit
      # suite cannot see it: every component still renders in isolation, and
      # the failure only exists when the real page mounts, loads, and re-renders
      # with a document. Playwright caught it in seconds; nothing else did.
      #
      # The suite runs entirely signed out against browser storage, so it needs
      # no secrets and cannot be skipped for want of them.
      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Separate job: it needs a browser download, and a lint or type error should
  # report in seconds rather than after an install of Chromium.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Runs signed out, against browser storage. No project, no seeded data
      # and no secrets -- an E2E suite that needs live credentials is one that
      # stops being run, and these tests guard data loss, which is exactly the
      # thing that must not go unguarded.
      - name: End-to-end tests
        run: npx playwright test
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
