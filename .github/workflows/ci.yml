name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Ordered cheapest-to-most-expensive so an obvious break fails fast.
      #
      # Not yet `--deny-warnings`: there is a known backlog of 9 warnings
      # (set-state-in-effect, only-export-components, refs-during-render,
      # no-eval). The lint-cleanup workstream clears them and then flips this
      # to blocking. Advertising a gate that cannot pass would be worse than
      # saying plainly that it is not a gate yet.
      - name: Lint
        run: npx oxlint

      - name: Typecheck
        run: npx tsc -b

      - name: Unit and integration tests
        run: npx vitest run --reporter=dot

      # The build needs the Vite env vars to exist, but not to be real: the
      # Supabase client is constructed at module load and the AI key never
      # reaches the client at all.
      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

      # End-to-end runs in its own job below, not here. It was in both, which
      # downloaded Chromium and ran the whole suite twice per commit -- and the
      # copy here had no Vite env vars, so it was the less correct of the two.

  # Separate job: it needs a browser download, and a lint or type error should
  # report in seconds rather than after an install of Chromium.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Runs signed out, against browser storage. No project, no seeded data
      # and no secrets -- an E2E suite that needs live credentials is one that
      # stops being run, and these tests guard data loss, which is exactly the
      # thing that must not go unguarded.
      - name: End-to-end tests
        run: npx playwright test
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The assistant's behaviour, which only a real model can answer for.
  #
  # Skipped rather than failed without a key: a fork and most pull requests
  # cannot see repository secrets, and a red X on every outside contribution
  # for want of a credential they were never going to have teaches people to
  # ignore the X.
  #
  # `evals/promptVersion.test.ts` runs in the ordinary suite and is what stops
  # a prompt change shipping without these being run -- this job is the easy
  # path to running them, not the thing that enforces it.
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Assistant behaviour evals
        run: npx vitest run supabase/functions/ai-assist/evals --reporter=verbose
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
