<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Fallback for platforms that ignore SVG favicons (older Safari, some
         Android launchers); both point at the same vector mark. -->
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="mask-icon" href="/icon.svg" color="#000000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MARGIN</title>

    <!--
      Theme, applied before the first paint.

      This has to be a blocking inline script in <head> rather than anything
      React does. The bundle is a module, so it is deferred by definition: by
      the time it runs the browser has already painted, and a student who set
      dark mode would get a full white flash on every load -- at night, on the
      one screen they are looking at. Reading the same key the store reads
      (THEME_STORAGE_KEY in src/theme/themeStore.ts) and setting the same class
      means React mounts into a document that is already correct and has nothing
      to correct.

      Wrapped in try/catch because localStorage throws outright in Safari's
      private mode, and an exception here would stop the page before the app
      script ran at all.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('margin:theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
          }
        } catch (e) {}
      })()
    </script>

    <!--
      Document fonts offered in the editor's font menu.

      One stylesheet request; the actual font binaries are fetched lazily by
      the browser only for families that get rendered, so listing many here
      costs little until they are used. `display=swap` means text paints in a
      fallback immediately rather than staying invisible while a face loads.

      Weights are limited to 400 and 700 -- enough for body text and bold,
      without pulling the full range of each family.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@400;700&family=Dancing+Script:wght@400;700&family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Lato:wght@400;700&family=Lora:wght@400;700&family=Merriweather:wght@400;700&family=Montserrat:wght@400;700&family=Nunito:wght@400;700&family=Open+Sans:wght@400;700&family=Oswald:wght@400;700&family=PT+Serif:wght@400;700&family=Pacifico&family=Playfair+Display:wght@400;700&family=Poppins:wght@400;700&family=Raleway:wght@400;700&family=Roboto+Mono:wght@400;700&family=Roboto:wght@400;500;700&family=Source+Code+Pro:wght@400;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
